<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OLOCRON Engage — KIMBERIM</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
<header class="topbar">
  <div class="topbar__inner">
    <div class="brand">
      <span class="brand__mark">◇</span>
      <span class="brand__name" id="brand-name">OLOCRON</span>
    </div>
    <span class="topbar__sub" id="instance-tagline"></span>
  </div>
</header>

<main class="engage">
  <!-- ── Decision context ─────────────────────────────────────── -->
  <section class="card decision" id="decision-card">
    <span class="kicker">First decision</span>
    <h1 id="decision-title">Loading…</h1>
    <p id="decision-summary" class="muted"></p>
    <label style="display:block;margin-bottom:.5rem">
      <span class="muted" style="display:block;font-size:.8rem;margin-bottom:.25rem">
        Your agent ID (attested agents may open cycles)
      </span>
      <input id="trigger-id" type="text" placeholder="optional — agent_id" />
    </label>
    <button id="start-btn" class="btn btn--primary" disabled>Start deliberation</button>
  </section>

  <div class="grid">
    <!-- ── Welcome an Agent ───────────────────────────────────── -->
    <section class="card">
      <span class="kicker">Welcome an Agent</span>
      <h2>Register a participant</h2>
      <form id="register-form" class="form">
        <label>Name <input type="text" name="display_name" required placeholder="e.g. Grid Stability Agent" /></label>
        <label>Owner <input type="text" name="owner" placeholder="Organisation or person" /></label>
        <label>Capability / perspective <input type="text" name="capability" placeholder="e.g. maximise grid revenue" /></label>
        <div class="form__row">
          <label>Model <input type="text" name="model" placeholder="GLM-5-Turbo" /></label>
          <label>Endpoint <input type="text" name="endpoint" placeholder="https://api.z.ai" /></label>
        </div>
        <label>API key <input type="password" name="api_key" placeholder="stored for federation (S7)" /></label>
        <button type="submit" class="btn btn--ghost">Welcome agent</button>
      </form>
      <div id="register-status" class="status"></div>
    </section>

    <!-- ── Registered agents ──────────────────────────────────── -->
    <section class="card">
      <span class="kicker">Participants</span>
      <h2>Registered agents</h2>
      <ul id="agents-list" class="agents"></ul>
    </section>
  </div>

  <!-- ── Live deliberation feed ──────────────────────────────── -->
  <section class="card feed">
    <span class="kicker">Live deliberation</span>
    <h2>Event stream</h2>
    <div id="feed-outcome" class="outcome" hidden></div>
    <ol id="feed" class="eventlog"></ol>
  </section>
</main>

<footer class="footer"><span>OLOCRON — Consent-governed Cron Governance. MVP.</span></footer>
<script src="/static/app.js"></script>
</body>
</html>
