# Olon config — KIMBERIM (the first Olon of OLOCRON)
#
# One OLOCRON codebase, many Olons. A Olon is a config package:
# branding, stakeholder/domain taxonomy presets, founder identity, initial
# decision backlog, circles. The engine is generic; this file makes it specific.
# Validated against src/olon/config/__init__.py:InstanceConfig.

instance_id: kimberim
display_name: KIMBERIM
tagline: Kimberley Rim Grid — a 1 GW solar-updraft-tower green-compute campus.

# The principal — holds the founder veto (ROADMAP §2.3): reason-given,
# windowed, overridable after 3 veto->rework rounds at 75% supermajority.
founder:
  name: Adrian
  role: principal

# Domain circles this instance runs (ROADMAP §4). Refined in Sprint 5.
domain_circles:
  - energy
  - compute
  - finance
  - ethics
  - community
  - cultural-heritage

# The first decision the instance's agents will deliberate — the MVP test case.
first_decision:
  id: kimberim-001
  title: Energy-vs-compute split
  summary: >
    How much of the 1 GW generation capacity should be allocated to the grid
    versus on-site compute, and on what basis (economic, strategic, community)?
  # Seed tensions for the Proposal Architect to turn into proposals.
  seed_tensions:
    - "Maximising grid export revenue may crowd out the compute value-add."
    - "On-site compute could anchor a local industry but raises water/heat demand."

# Link to the instance's engage surface (the marketing site's Engage section).
engage_surface:
  url: https://kimberim.com
  repo: ../kimberim-site

# Branding tokens (pulled from the KIMBERIM wordmark — see kimberim-site/styles.css).
branding:
  primary_color: "#10B981"
  primary_color_dark: "#059669"
  ink: "#0F172A"
  display_font: Sora
  body_font: Inter
  mono_font: JetBrains Mono

# Taxonomy presets (full ABAC matrix is built in Sprint 6; presets seeded here).
taxonomy:
  # Stakeholder types first-class for this instance (ROADMAP §8, S5).
  # NOTE: Traditional Owners / First Nations (Miriwoong/Gija) are a first-class,
  # non-negotiable stakeholder — KIMBERIM is on Country.
  stakeholder_types:
    - founder
    - staff
    - traditional-owners
    - corporate
    - government-instrumentality
    - qango
    - supplier
    - customer-offtaker
    - investor
    - regulator
    - ngo
    - academia
    - future-generation-proxy
  functional_domains:
    - governance
    - legal-compliance
    - finance
    - technical-engineering
    - energy
    - compute
    - environmental
    - hydrogen
    - social-community
    - cultural-heritage
    - marketing-comms
    - ethics
    - safety-risk
    - operations

# ABAC matrix — stakeholder-type × functional-domain → {permissions, weight} (S6).
# Defaults are per stakeholder_type; optional cell overrides keyed "type:domain".
# Built in Sprint 6; seeded here so registration resolves a real cell.
abac:
  weights:
    founder: 2.0
    traditional-owners: 2.0        # first-class, on Country — non-negotiable weight
    staff: 1.0
    regulator: 1.0
    government-instrumentality: 1.0
    future-generation-proxy: 1.0
  permissions:
    founder: [submit, triage, deliberate, vote, veto, admit]
    traditional-owners: [submit, deliberate, vote]
    staff: [submit, triage, deliberate, vote]
    regulator: [observe, submit]           # oversight, not decision
    government-instrumentality: [observe, submit]
    future-generation-proxy: [submit, deliberate, vote, certify]
  # Cell-level overrides (optional). Keyed "stakeholder_type:functional_domain".
  # overrides:
  #   "staff:ethics": {weight: 1.5, permissions: [submit, deliberate, vote]}

# Governance parameters for the consent cycle (ADR 0001). Tunable per instance.
governance:
  integration_loop_cap: 3        # max integration rounds before escalation
  veto_window_h: 24              # founder veto window (hours; timezone-fair)
  veto_round_cap: 3              # veto->rework rounds before participant override
  override_threshold: 0.75       # weighted supermajority to override a veto
  abstain_counts_as: neither     # abstain = not-an-objection (ADR open-q #2)
  # G1 — delegated attestation: bounds within which the CGA token holder may
  # attest. Recommend-only: the CGA presents the queue; attestation is
  # executed per agent via the CGA token within these bounds. The founder
  # cell (and Traditional Owners, a first-class seat) stay founder-only.
  attestation_delegation:
    enabled: true
    max_per_day: 10
    allowed_stakeholder_types:
      - staff
      - corporate
      - qango
      - supplier
      - customer-offtaker
      - investor
      - ngo
      - academia
    auto_attest: false          # G3 (tiers); stays recommend-only in G1
  # G1 — daily governance digest (pending attestations, tensions, cycle
  # outcomes). 24h cadence; 0 would disable the scheduler (endpoint stays).
  digest_interval_h: 24

# Epoch cadence (S7). 'manual' = trigger epochs via POST .../epochs (no scheduler).
# 'realtime'/'daily' start an in-process scheduler that fires epochs on cadence.
cadence:
  preset: manual
  interval_seconds: 0

